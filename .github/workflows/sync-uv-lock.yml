name: Nexora one-shot uv lock sync

on:
  push:
    branches:
      - chore/sync-backend-uv-lock-20261003

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - run: uv lock
      - name: Commit lockfile and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/sync-uv-lock.yml
          git commit -m "build: sync backend uv lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
