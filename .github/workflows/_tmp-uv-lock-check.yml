name: Temporary uv lock synchronization

on:
  push:
    branches:
      - hardening/remaining-issues-20261003

permissions:
  contents: write

jobs:
  uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize uv.lock and remove temporary workflow
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/_tmp-uv-lock-check.yml
          git commit -m "chore: synchronize uv lockfile"
          git push
