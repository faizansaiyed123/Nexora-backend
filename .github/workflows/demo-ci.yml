name: Nexora Backend Demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src/backend
      - run: python -m pytest -q tests/test_demo.py
