name: Temporary backend Docker verification

on:
  push:
    branches:
      - hardening/remaining-issues-20261003

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t nexora-backend-hardening-verify .
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-docker-verify.yml
          git commit -m "chore: remove temporary Docker verification workflow"
          git push
