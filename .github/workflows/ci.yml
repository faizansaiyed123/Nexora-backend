name: Nexora Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "audit/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-only-nexora-ci-secret-32-characters-minimum
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "uv==0.12.7"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
          REDIS_URL: redis://localhost:6379/0
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexora
          REDIS_URL: redis://localhost:6379/0

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET_KEY: test-only-nexora-ci-secret-32-characters-minimum
          CORS_ORIGINS: '["https://app.example.test"]'
          ALLOWED_HOSTS: '["api.example.test"]'
          FRONTEND_URL: https://app.example.test
        run: docker compose -f docker-compose.prod.yml config

      - name: Build backend production image
        run: docker build --pull -t nexora-backend:ci .
