name: Nexora Backend Docker Verify

on:
  push:
    branches:
      - verify/docker-build-20261003

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nexora-backend-verify .
      - name: Remove verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/docker-verify.yml
          git commit -m "chore: remove temporary docker verification workflow"
          git push origin HEAD:verify/docker-build-20261003
