# Render deployment config for Nexora Backend
# https://render.com/docs/yaml-spec

databases:
  - name: nexora-db
    databaseName: nexora
    plan: free

services:
  - type: web
    name: nexora-backend
    env: python
    plan: free
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      playwright install --with-deps chromium
      alembic upgrade head || true
      python init_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: databaseUrl
      - key: ENVIRONMENT
        value: production
      - key: AUTO_RENDER_ENABLED
        value: true
      - key: CORS_ORIGINS
        value: https://nexora-frontend.onrender.com
    healthCheckPath: /health