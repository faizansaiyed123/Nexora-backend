databases:
  - name: nexora-db
    databaseName: nexora
    plan: free
    region: singapore

services:
  - type: web
    name: nexora-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: nexora-backend-5ie2.onrender.com
      - key: AUTO_RENDER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://nexora-frontend.onrender.com
