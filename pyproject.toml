[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1.0",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=7.0,<8.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
]
