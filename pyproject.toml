[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "aiosmtplib>=3.0,<4",
    "asyncpg>=0.30,<1.0",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=7.0,<8.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1",
    # Collection engine
    "httpx>=0.28,<1",
    "httpcore>=1.0.9,<2",
    "PyJWT>=2.10,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<7",
    # Background workers
    "celery>=5.5,<6",
    # Browser collection
    "playwright>=1.50,<2",
]


[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
]
